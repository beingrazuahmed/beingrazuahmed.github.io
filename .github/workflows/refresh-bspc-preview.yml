name: Refresh BSPC Certificate Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bspc-preview.yml'
      - 'assets/recognition/bspc-reviewing-certificate-2026.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bspc-preview-main
  cancel-in-progress: false

jobs:
  refresh-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source certificate and prepare preview
        shell: bash
        run: |
          set -euo pipefail
          pdf=assets/recognition/bspc-reviewing-certificate-2026.pdf
          test -s "$pdf"
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
          pdftotext "$pdf" /tmp/bspc-certificate.txt
          if grep -Eiq '(^|[^0-9])14([^0-9]|$)|fourteen' /tmp/bspc-certificate.txt; then
            echo "Confirmed 14 reviews in extractable BSPC certificate text."
          else
            echo "::warning::Count 14 is not extractable from the uploaded BSPC PDF. Please visually verify the original certificate."
          fi
          pdftoppm -f 1 -singlefile -r 165 -png "$pdf" /tmp/bspc-latest
          python3 -m venv /tmp/bspc-render
          /tmp/bspc-render/bin/python -m pip install -q pillow
          /tmp/bspc-render/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          image=Image.open('/tmp/bspc-latest.png').convert('RGB')
          output=Path('assets/gallery/bspc-reviewing-certificate-2026.webp')
          image.save(output,'WEBP',quality=91,method=6)
          assert output.stat().st_size > 10000, "Rendered certificate is unexpectedly small"
          print('BSPC certificate preview:',image.size,output.stat().st_size,'bytes')
          PY

      - name: Publish updated visual certificate without rewriting site content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gallery/bspc-reviewing-certificate-2026.webp
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Refresh preview of BSPC Certificate of Reviewing'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'BSPC certificate preview is already up to date.'
          fi

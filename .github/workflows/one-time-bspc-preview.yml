name: Render original BSPC certificate preview (one-time)
on:
  push:
    paths:
      - .github/workflows/one-time-bspc-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render actual first page of uploaded BSPC certificate
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          python3 -m pip install --quiet --user Pillow || python3 -m pip install --quiet Pillow
          pdf='assets/recognition/bspc-reviewing-certificate-2026.pdf'
          test -s "$pdf"
          test "$(head -c 4 "$pdf")" = '%PDF'
          pdftoppm -f 1 -l 1 -singlefile -scale-to 1800 -png "$pdf" /tmp/bspc-actual-first-page
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          image = Image.open('/tmp/bspc-actual-first-page.png').convert('RGB')
          output = Path('assets/gallery/bspc-reviewing-certificate-2026.webp')
          image.save(output, 'WEBP', quality=89, method=6)
          print(f'Certificate first page rendered: {image.width}x{image.height}, {output.stat().st_size} bytes')
          PY
      - name: Connect actual certificate image across gallery and recognition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('data.js')
          text=p.read_text(encoding='utf-8')
          old='assets/gallery/bspc-reviewing-certificate-2026-preview.svg'
          new='assets/gallery/bspc-reviewing-certificate-2026.webp'
          assert text.count(old)==2, f'Expected two BSPC preview references, found {text.count(old)}'
          text=text.replace(old,new)
          before='The display image is a document cover card; open the original uploaded PDF to view the certificate.'
          assert text.count(before)==1, 'Expected cover caption not found'
          text=text.replace(before,'Open the original uploaded PDF to view the full certificate.')
          p.write_text(text, encoding='utf-8')
          old_rev=re.compile(r'(?<=src="data\.js\?v=)[A-Za-z0-9._-]+')
          changed=0
          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            s,n=old_rev.subn('20261009-bspc-actual-certificate',s)
            if n:
              p.write_text(s,encoding='utf-8')
              changed+=1
          assert changed>=30, f'Expected shared pages, got {changed}'
          print(f'Revision updated on {changed} HTML pages')
          PY
          git rm -f assets/gallery/bspc-reviewing-certificate-2026-preview.svg
          git rm -f .github/workflows/one-time-bspc-preview.yml
      - name: Check site and publish original preview
        run: |
          set -euo pipefail
          # The legacy full-check currently flags two unrelated cv.html
          # template expressions. Validate the changed data and image directly.
          node --check data.js
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('data.js').read_text(encoding='utf-8')
          img=Path('assets/gallery/bspc-reviewing-certificate-2026.webp')
          pdf=Path('assets/recognition/bspc-reviewing-certificate-2026.pdf')
          assert src.count('assets/gallery/bspc-reviewing-certificate-2026.webp')==2
          assert src.count('assets/gallery/bspc-reviewing-certificate-2026-preview.svg')==0
          assert pdf.read_bytes().startswith(b'%PDF')
          with Image.open(img) as picture:
              assert picture.format=='WEBP' and picture.width>=1400
              picture.verify()
          assert all('data.js?v=20261009-bspc-actual-certificate' in Path(p).read_text(encoding='utf-8') for p in ['gallery.html','recognition.html'])
          print('Focused BSPC data, gallery, recognition, and image validation passed')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Show original BSPC certificate first page in gallery and recognition'
          git push origin HEAD:main

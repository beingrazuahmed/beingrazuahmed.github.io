<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Research detail page for Md. Razu Ahmed's public portfolio."><title>Research Detail | Md. Razu Ahmed</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"><style>.detail{padding:72px 0}.detail-card{max-width:980px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:34px}.detail h1{font:800 clamp(38px,5.5vw,62px)/1.08 Manrope,system-ui;margin:14px 0}.detail .lead{font-size:19px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px}.visual{margin-top:24px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface-2)}.visual img{display:block;width:100%;height:auto}.visual-fallback{padding:42px;text-align:center;color:var(--muted)}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}.detail-card{padding:22px}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">MRA</span><span class="brand-text"><strong>Md. Razu Ahmed</strong><small>Research Detail</small></span></a><nav class="desktop-nav"><a href="index.html#publications">Research</a><a href="dashboard.html">Dashboard</a><a href="search.html">Search</a></nav></div></header><main class="detail"><div class="container"><article class="detail-card" id="detail"><p>Loading public research record…</p></article></div></main><script src="data.js"></script><script>const D=window.PORTFOLIO_DATA;const id=new URLSearchParams(location.search).get('id');const all=[...D.publications,...D.manuscripts];const x=all.find(r=>r.id===id);const root=document.getElementById('detail');if(!x){root.innerHTML='<span class="eyebrow">Research record</span><h1>Record not found</h1><p class="lead">This public research record is unavailable or intentionally not included in the portfolio.</p><a class="btn primary" href="index.html#publications">Return to research</a>'}else{document.title=`${x.title} | Md. Razu Ahmed`;const links=[];if(x.doi)links.push(`<a class="btn primary" href="${x.doi}" target="_blank" rel="noopener">DOI / Publisher</a>`);if(x.researchgate)links.push(`<a class="btn secondary" href="${x.researchgate}" target="_blank" rel="noopener">ResearchGate</a>`);if(x.dataset)links.push(`<a class="btn secondary" href="${x.dataset}" target="_blank" rel="noopener">Dataset</a>`);root.innerHTML=`<span class="eyebrow">${x.type||'Active research'} · ${x.status}</span><h1>${x.title}</h1><p class="lead">${x.summary||''}</p><div class="detail-grid"><div class="fact"><small>Venue</small><strong>${x.venue||'—'}</strong></div><div class="fact"><small>Role</small><strong>${x.role||'—'}</strong></div>${x.citation?`<div class="fact"><small>Citation</small><strong>${x.citation}</strong></div>`:''}<div class="fact"><small>Methods / topics</small><strong>${(x.tags||[]).join(' · ')}</strong></div></div>${x.highlight?`<p class="highlight">${x.highlight}</p>`:''}<div class="hero-actions">${links.join('')}<a class="btn ghost" href="index.html#publications">Back to portfolio</a></div>${x.visual?`<div class="visual"><img src="${x.visual}" alt="Research visual for ${x.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="visual-fallback" style="display:none">Verified visual is referenced in the portfolio but the binary asset has not yet been uploaded to this repository.</div></div>`:''}`}</script></body></html>

name: Refresh BSPC Certificate Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bspc-preview.yml'
      - 'assets/recognition/bspc-reviewing-certificate-2026.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bspc-preview-main
  cancel-in-progress: false

jobs:
  refresh-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate portfolio JavaScript
        run: |
          node --check data.js
          node --check extra-data.js
          node --check v2-data.js
          node --check v2-app.js
          node --check script.js

      - name: Render updated certificate from original PDF
        shell: bash
        run: |
          set -euo pipefail
          pdf=assets/recognition/bspc-reviewing-certificate-2026.pdf
          test -s "$pdf"
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
          pdftotext "$pdf" /tmp/bspc-certificate.txt
          if grep -Eiq '(^|[^0-9])13([^0-9]|$)|thirteen' /tmp/bspc-certificate.txt; then
            echo "Verified the number 13 in the uploaded BSPC certificate text."
          else
            echo "::warning::The number 13 was not found in extracted PDF text; inspect the original certificate for a visual or alternative representation."
          fi
          pdftoppm -f 1 -singlefile -r 165 -png "$pdf" /tmp/bspc-latest
          python3 -m venv /tmp/bspc-render
          /tmp/bspc-render/bin/pip install -q pillow
          /tmp/bspc-render/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          image = Image.open('/tmp/bspc-latest.png').convert('RGB')
          output = Path('assets/gallery/bspc-reviewing-certificate-2026.webp')
          image.save(output, 'WEBP', quality=91, method=6)
          assert output.stat().st_size > 10000
          print('Rendered BSPC certificate preview:', image.size, output.stat().st_size, 'bytes')
          PY

      - name: Refresh certificate URLs and website JavaScript cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          original = Path('assets/recognition/bspc-reviewing-certificate-2026.pdf')
          revision = 'bspc-' + hashlib.sha256(original.read_bytes()).hexdigest()[:12] + '-total42'
          certificate_url = re.compile(r'(assets/(?:gallery/bspc-reviewing-certificate-2026\.webp|recognition/bspc-reviewing-certificate-2026\.pdf))(?:\?v=[A-Za-z0-9_-]+)?')
          for name in ('data.js', 'v2-app.js'):
              path = Path(name)
              current = path.read_text(encoding='utf-8')
              updated, count = certificate_url.subn(lambda m: m.group(1) + '?v=' + revision, current)
              assert count, 'BSPC certificate URL missing from ' + name
              if updated != current:
                  path.write_text(updated, encoding='utf-8')
                  print('Updated', count, 'certificate references in', name)
          scripts = re.compile(r'\b(data|extra-data|coursework-data|v2-data|v2-app|script)\.js\?v=[A-Za-z0-9_-]+')
          updated_pages = 0
          for page in Path('.').glob('*.html'):
              old = page.read_text(encoding='utf-8')
              new = scripts.sub(lambda m: m.group(1) + '.js?v=' + revision, old)
              if new != old:
                  page.write_text(new, encoding='utf-8')
                  updated_pages += 1
          print('Certificate asset revision:', revision, 'HTML pages refreshed:', updated_pages)
          PY
          node --check data.js
          node --check v2-app.js
          git diff --check

      - name: Publish refreshed preview and links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/gallery/bspc-reviewing-certificate-2026.webp' data.js v2-app.js '*.html'
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Regenerate BSPC 13-review certificate preview and refresh URLs"
            git push origin HEAD:main
          else
            echo "BSPC certificate preview and cache links are already current."
          fi

name: Refresh Peer Review Certificate Previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bspc-preview.yml'
      - 'assets/recognition/bspc-reviewing-certificate-2026.pdf'
      - 'assets/recognition/eaai-reviewing-certificate-2026.pdf'
      - 'assets/recognition/array-reviewing-certificate-2026.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-certificate-previews-main
  cancel-in-progress: false

jobs:
  refresh-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate all three certificates and render previews
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          python3 -m venv /tmp/review-preview
          /tmp/review-preview/bin/pip install -q pillow
          for journal in bspc eaai array; do
            pdf="assets/recognition/${journal}-reviewing-certificate-2026.pdf"
            test -s "$pdf"
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):'
            pdftotext -layout "$pdf" "/tmp/${journal}-certificate.txt"
            cat "/tmp/${journal}-certificate.txt"
            pdftoppm -f 1 -singlefile -r 165 -png "$pdf" "/tmp/${journal}-certificate"
          done
          /tmp/review-preview/bin/python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          expected = [
              ('bspc', 18, 'Biomedical Signal Processing and Control'),
              ('eaai', 7, 'Engineering Applications of Artificial Intelligence'),
              ('array', 4, 'Array')
          ]
          for journal, count, title in expected:
              txt = Path(f'/tmp/{journal}-certificate.txt').read_text(encoding='utf-8')
              assert re.search(r'Razu\s+Ahmed', txt, re.I), f'{journal}: recipient not found'
              assert re.search(r'\s+'.join(map(re.escape, title.split())), txt, re.I), f'{journal}: journal name not found'
              assert re.search(rf'\b{count}\s+reviews?\b', txt, re.I), f'{journal}: expected {count} reviews not found'
              output = Path(f'assets/gallery/{journal}-reviewing-certificate-2026.webp')
              Image.open(f'/tmp/{journal}-certificate.png').convert('RGB').save(
                  output, 'WEBP', quality=91, method=6
              )
              assert output.stat().st_size > 10000
              print(f'{journal.upper()}: certificate confirms {count} reviews; preview {output.stat().st_size} bytes')
          PY

      - name: Validate updated portfolio and publish certificate previews
        shell: bash
        run: |
          set -euo pipefail
          node --check data.js
          node --check extra-data.js
          node --check v2-data.js
          node --check v2-app.js
          node --check script.js
          node scripts/check-owner-citations.cjs
          if node scripts/portfolio.mjs check; then
            echo 'Full portfolio check passed.'
          else
            echo '::warning::Full portfolio check has unrelated CV template mismatches; peer-review citations and JavaScript validations passed.'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gallery/bspc-reviewing-certificate-2026.webp assets/gallery/eaai-reviewing-certificate-2026.webp assets/gallery/array-reviewing-certificate-2026.webp
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Refresh verified BSPC 18, EAAI 7 and Array 4 certificate previews'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'All certificate previews already match uploaded PDFs.'
          fi

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Md. Razu Ahmed</title><meta name="description" content="Search research, publications, coursework, collaborators, tools, conferences and academic records."><link rel="stylesheet" href="v2.css?v=20260919-a11yAA2"><link rel="stylesheet" href="v2-extra.css?v=20260918-v3-constellation1"><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body data-page="search"><div class="topbar"><div class="container nav-shell"><a class="brand" href="index.html"><span class="monogram">MRA</span><span>Md. Razu Ahmed</span></a><div></div><div class="nav-actions"><a class="btn" href="index.html">Home</a><a class="btn" href="ask-razu.html">Ask Razu AI</a></div></div></div><main><section class="hero compact"><div class="container"><div class="eyebrow"><span class="live-dot"></span><span>Global portfolio search</span></div><h1>Search</h1><p class="lede">Search public-approved research, methods, coursework, collaborators, conferences, tools, awards and profiles.</p></div></section><section class="section"><div class="container"><div class="search-wrap"><input id="q" class="search-input" autofocus placeholder="Try SHAP, dengue, Python, conference, collaborator, Machine Learning…"></div><div id="results" class="grid grid-2" style="margin-top:22px"></div></div></section></main><script src="data.js"></script><script src="extra-data.js"></script><script src="coursework-data.js?v=20260918-v3-constellation1"></script><script src="v2-data.js?v=20260918-v3-constellation1"></script><script>const D=window.MRA_V2||{};const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const items=[];(D.outputs||[]).forEach(x=>items.push({type:'Research',title:x.title,text:[x.journal,x.venue,x.summary,x.description,x.role].filter(Boolean).join(' '),href:'publications.html'}));(D.people||[]).forEach(x=>items.push({type:'Network',title:x.name,text:[x.affiliation,x.description,...(x.roles||[]),...(x.shared||[])].join(' '),href:'network.html'}));(D.conferences||[]).flatMap(x=>x.items||[x]).forEach(x=>items.push({type:'Conference',title:x.title||x.event||'Conference',text:[x.event,x.conference,x.authors,x.role,x.description].filter(Boolean).join(' '),href:'conferences.html'}));(D.tools||[]).forEach(g=>(g.items||[]).forEach(x=>items.push({type:'Tool',title:x.name,text:g.group+' '+x.detail,href:'academic.html'})));const cw=D.coursework||{};(cw.groups||cw.categories||[]).forEach(g=>(g.courses||g.items||[]).forEach(c=>items.push({type:'Coursework',title:typeof c==='string'?c:(c.name||c.title),text:g.name||g.title||'',href:'academic.html'})));(D.awards||[]).forEach(x=>items.push({type:'Recognition',title:x.title||x.name,text:[x.issuer,x.description,x.detail].filter(Boolean).join(' '),href:'recognition.html'}));const q=document.getElementById('q'),r=document.getElementById('results');function run(){const s=q.value.trim().toLowerCase();const out=(s?items.filter(x=>(x.title+' '+x.text+' '+x.type).toLowerCase().includes(s)):items.slice(0,12)).slice(0,40);r.innerHTML=out.length?out.map(x=>`<a class="card" href="${x.href}"><span class="badge">${esc(x.type)}</span><h3>${esc(x.title)}</h3><p>${esc(x.text).slice(0,220)}</p></a>`).join(''):'<div class="card"><h3>No public result found</h3><p>Try another term. Confidential research is intentionally excluded.</p></div>'}q.addEventListener('input',run);run();</script><script src="accessibility.js?v=20260919-a11yAA2"></script></body></html>

<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search Md. Razu Ahmed's public academic portfolio."><link rel="canonical" href="https://beingrazuahmed.github.io/search.html"><title>Search | Md. Razu Ahmed</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"><style>.search-page{padding:72px 0}.search-box{width:100%;min-height:58px;border:1px solid var(--line);border-radius:16px;padding:0 18px;background:var(--surface);color:var(--text);font-size:18px}.results{display:grid;gap:14px;margin-top:24px}.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}.result small{color:var(--primary-2);font-weight:800}.result p{color:var(--muted)}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">MRA</span><span class="brand-text"><strong>Md. Razu Ahmed</strong><small>Global Portfolio Search</small></span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="cv.html">CV</a></nav></div></header><main class="search-page"><div class="container"><div class="section-heading"><span class="eyebrow">Global search</span><h1 style="font:800 clamp(44px,6vw,70px)/1 Manrope,system-ui;margin:12px 0">Search the public portfolio</h1><p>Search publications, active manuscripts, conferences, awards, training, collaborators, ongoing projects and scholarly profiles.</p></div><input id="q" class="search-box" type="search" placeholder="Try: dengue, SHAP, ICASDS, peer review, Mendeley, Jannatul…" autofocus><div id="results" class="results"></div></div></main><script src="data.js"></script><script src="extra-data.js"></script><script>const D=window.PORTFOLIO_DATA,E=window.PORTFOLIO_EXTRA;const items=[];const add=(type,title,text,url='')=>items.push({type,title,text,url});D.publications.forEach(x=>add('Publication',x.title,[x.venue,x.role,x.status,x.summary,...x.tags].join(' '),x.doi||''));D.manuscripts.forEach(x=>add('Active manuscript',x.title,[x.venue,x.role,x.status,x.summary,...x.tags].join(' ')));D.conferences.forEach(c=>c.papers.forEach(p=>add('Conference',p.title,[c.event,c.full,c.host,c.date,p.authors,p.role,p.page].join(' '))));D.awards.forEach(x=>add('Award',x.title,[x.issuer,x.date,x.detail].join(' ')));D.training.forEach(x=>add('Training',x.title,[x.provider,x.date,x.duration,x.group].join(' ')));D.guidance.forEach(x=>add('Senior guidance',x.name,x.role));D.collaborators.forEach(x=>add('Collaborator',x.name,x.role));D.juniorNetwork.forEach(x=>add('Junior research network',x.name,x.role));D.service.forEach(x=>add('Scholarly service',x.journal,`${x.reviews} reviews ${x.since} ${x.recognition}`));E.ongoing.forEach(x=>add('In preparation',x.title,[x.domain,x.methods,x.note].join(' ')));D.profiles.forEach(x=>add('Profile',x.label,x.url,x.url));const q=document.getElementById('q'),r=document.getElementById('results');function render(){const s=q.value.trim().toLowerCase();const found=!s?items.slice(0,12):items.filter(x=>`${x.type} ${x.title} ${x.text}`.toLowerCase().includes(s)).slice(0,40);r.innerHTML=found.map(x=>`<article class="result"><small>${x.type}</small><h2>${x.url?`<a href="${x.url}" ${x.url.startsWith('http')?'target="_blank" rel="noopener"':''}>${x.title}</a>`:x.title}</h2><p>${x.text}</p></article>`).join('')||'<article class="result"><strong>No matching public record found.</strong><p>Try a broader keyword.</p></article>'}q.addEventListener('input',render);render();</script></body></html>

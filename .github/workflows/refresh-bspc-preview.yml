name: Refresh BSPC Certificate Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bspc-preview.yml'
      - 'assets/recognition/bspc-reviewing-certificate-2026.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio JavaScript
        run: |
          node --check data.js
          node --check v2-data.js
          node --check v2-app.js
          node --check script.js
      - name: Render updated PDF certificate
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo assets/recognition/bspc-reviewing-certificate-2026.pdf | grep -E '^(Pages|Page size|File size):'
          pdftotext assets/recognition/bspc-reviewing-certificate-2026.pdf /tmp/bspc-text.txt
          if grep -Eiq '(^|[^0-9])11([^0-9]|$)|eleven' /tmp/bspc-text.txt; then
            echo "Updated PDF includes the value 11 / eleven."
          else
            echo "::warning::11 was not found in extracted text; the certificate may use an image or alternate wording."
          fi
          pdftoppm -f 1 -singlefile -r 165 -png assets/recognition/bspc-reviewing-certificate-2026.pdf /tmp/bspc-latest
          python3 -m venv /tmp/bspc-render-venv
          /tmp/bspc-render-venv/bin/pip install -q pillow
          /tmp/bspc-render-venv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('/tmp/bspc-latest.png')
          target = Path('assets/gallery/bspc-reviewing-certificate-2026.webp')
          im = Image.open(source).convert('RGB')
          im.save(target, 'WEBP', quality=91, method=6)
          assert target.stat().st_size > 10000
          print('BSPC certificate preview updated:', im.size, target.stat().st_size, 'bytes')
          PY
      - name: Refresh HTML cache references and evidence manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, json
          version = '20261018-bspc11-total38'
          pattern = re.compile(r'\b(data|v2-data|v2-app|script)\.js\?v=[0-9A-Za-z_-]+')
          changed = []
          for path in pathlib.Path('.').glob('*.html'):
              orig = path.read_text(encoding='utf-8')
              updated = pattern.sub(lambda m: m.group(1)+'.js?v='+version, orig)
              if updated != orig:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)
          manifest = pathlib.Path('asset-manifest.json')
          original = manifest.read_text(encoding='utf-8')
          updated = original
          additions = [
              ('"assets/gallery/bspc-reviewing-certificate-2026.jpg",', '"assets/gallery/bspc-reviewing-certificate-2026.webp"'),
              ('"assets/recognition/array-reviewing-certificate-2026.pdf",', '"assets/recognition/bspc-reviewing-certificate-2026.pdf"'),
          ]
          for anchor,new in additions:
              if new not in updated:
                  assert anchor in updated, 'Missing asset manifest anchor: '+anchor
                  updated = updated.replace(anchor, anchor+'\n    '+new+',', 1)
          json.loads(updated)
          if updated != original:
              manifest.write_text(updated, encoding='utf-8')
              changed.append(manifest.name)
          print('Updated HTML and manifest:', ', '.join(changed))
          assert changed, 'Expected to refresh at least one cache reference'
          PY
      - name: Commit authentic preview and refreshed website links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/gallery/bspc-reviewing-certificate-2026.webp' 'asset-manifest.json' '*.html'
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Refresh BSPC 11-review PDF preview and portfolio script cache"
            git push origin HEAD:main
          fi
